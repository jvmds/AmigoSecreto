<div class="main">
  <div>
    <mat-form-field appearance="outline">
      <mat-label>Clearable input</mat-label>
      <input matInput type="text" [(ngModel)]="value">
      @if (value) {
        <button matSuffix mat-icon-button aria-label="Clear" (click)="value=''">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>
    <button mat-stroked-button aria-label="Example icon button with a vertical three dot icon">
      <mat-icon>search</mat-icon>
    </button>
  </div>
  <mat-grid-list cols="1" rowHeight="2:1">
    @if(group$ | async; as group){
      <div class="root-component">
        <div class="text-child-component">
          <h1>{{group?.name}}</h1>
          <p>{{group?.description}}</p>
        </div>
        <button mat-icon-button [matMenuTriggerFor]="menu" class="menu-child-component">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item>
            <mat-icon>info</mat-icon>
            <span>Mais informações</span>
          </button>
          <button mat-menu-item>
            <mat-icon>edit</mat-icon>
            <span>Editar</span>
          </button>
          <button mat-menu-item>
            <mat-icon>delete</mat-icon>
            <span>Excluir</span>
          </button>
        </mat-menu>
      </div>
    }
  </mat-grid-list>
</div>
